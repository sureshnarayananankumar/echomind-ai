server:
  port: ${PORT:8080}

spring:
  application:
    name: echomind-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/echomind_ai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none          # schema is managed by database/echomind_schema.sql
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

echomind:
  jwt:
    # Provide a 256-bit+ secret via env in any shared environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://*.github.io}
  ai:
    # DEMO = simulated responses (no key needed). OPENAI = any OpenAI-compatible chat completions API.
    provider: ${AI_PROVIDER:DEMO}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
  storage:
    upload-dir: ${UPLOAD_DIR:uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
